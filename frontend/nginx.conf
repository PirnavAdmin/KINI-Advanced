server {
    listen 80;
    server_name kiniedx.com www.kiniedx.com;

    return 301 https://kiniedx.com$request_uri;
}

server {
    listen 443 ssl;
    server_name kiniedx.com www.kiniedx.com;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1g;
    add_header Strict-Transport-Security "max-age=31536000" always;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /uploads/ {
        proxy_pass http://backend:5000/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /coursepdfs/ {
        proxy_pass http://backend:5000/coursepdfs/;
        proxy_set_header Host $host;
    }

    location /attendanceHub {
        proxy_pass http://backend:5000/attendanceHub;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /notificationHub {
        proxy_pass http://backend:5000/notificationHub;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /chatHub {
        proxy_pass http://backend:5000/chatHub;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
